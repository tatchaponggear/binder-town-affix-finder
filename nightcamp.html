<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Night Camp Guide — อาชีพ Class 1 · Class 2 · High Class, สกิลทรี, บิลด์, อุปกรณ์ และมอนสเตอร์ ดึงจากข้อมูลเกมจริง">
<title>Night Camp Guide · PenguinzGear</title>
<script>(function(){ var t='dark'; try{ var o=sessionStorage.getItem('pz.theme'); if(o) t=o; }catch(e){} var q=new URLSearchParams(location.search).get('theme'); if(q==='light'||q==='dark') t=q; document.documentElement.setAttribute('data-theme',t); })()</script>
<link rel="icon" href="img/penguin-icon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f6f1ea; --bg-2:#ece3d6; --ink:#1d1520; --muted:#6c5d66; --line:rgba(120,70,70,.2);
  --card:rgba(255,255,255,.78); --card-2:#fff; --accent:#c2343f; --accent-2:#e8794a; --gold:#b8860b;
  --chip:rgba(120,70,70,.08); --shadow:0 14px 36px rgba(90,30,30,.12); --shadow-s:0 4px 14px rgba(90,30,30,.08);
  --display:"Kanit","Sarabun",system-ui,sans-serif; --body:"Sarabun","Kanit",system-ui,sans-serif;
  --r-common:#7d7466; --r-rare:#2f7fd6; --r-epic:#8a4fd6; --r-legend:#b8860b;
}
[data-theme="dark"]{
  --bg:#0d0a14; --bg-2:#171121; --ink:#f1e9ef; --muted:#a898a6; --line:rgba(230,120,120,.16);
  --card:rgba(28,20,36,.82); --card-2:#221a2c; --accent:#ff5a5f; --accent-2:#ffa25c; --gold:#ffc94d;
  --chip:rgba(255,255,255,.06); --shadow:0 14px 40px rgba(0,0,0,.5); --shadow-s:0 4px 14px rgba(0,0,0,.35);
  --r-common:#d6cfc2; --r-rare:#6fb6ff; --r-epic:#c792ff; --r-legend:#ffc94d; color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg);overflow-x:hidden;scroll-padding-top:120px}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.6;background:var(--bg);overflow-x:hidden}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
.sky{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:linear-gradient(180deg,#f3d9c4 0%,#f6ece2 45%,var(--bg) 80%)}
[data-theme="dark"] .sky{background:linear-gradient(180deg,#1a0a14 0%,#120b1c 40%,var(--bg) 80%)}
.moon{position:absolute;top:-80px;right:-60px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#ffd9c7,#f08a7a 55%,transparent 72%);opacity:.45;filter:blur(2px)}
[data-theme="dark"] .moon{background:radial-gradient(circle at 40% 40%,#ff9a8a,#c2203a 52%,transparent 72%);opacity:.55}
.stars{position:absolute;inset:0 0 50% 0;opacity:0;background-image:radial-gradient(1.4px 1.4px at 40px 50px,#fff,transparent),radial-gradient(1px 1px at 170px 110px,#fff,transparent),radial-gradient(1.6px 1.6px at 290px 30px,#fff,transparent),radial-gradient(1px 1px at 410px 140px,#fff,transparent);background-size:460px 200px}
[data-theme="dark"] .stars{opacity:.7}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:30;backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 0}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:17px;text-decoration:none;white-space:nowrap}
.logo img{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)}
.logo small{font-weight:500;color:var(--muted);font-size:13px}
.bar .sp{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 11px;cursor:pointer;font-size:15px;white-space:nowrap;text-decoration:none}
@media (max-width:420px){.logo small{display:none}}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;text-decoration:none;font-family:var(--display);font-weight:500;font-size:15px;padding:7px 14px;border-radius:12px;color:var(--muted);border:1px solid transparent}
.tabs a:hover{color:var(--ink);background:var(--chip)}
.tabs a.on{color:var(--ink);background:var(--card);border-color:var(--line);box-shadow:var(--shadow-s)}
.tabs a.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:2px}
main{padding:22px 0 60px;min-height:70vh}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0}
.hero{padding:18px 0 8px}
.hero h1{font-size:clamp(30px,5vw,48px);font-weight:800}
.hero h1 span{background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin:8px 0 0;max-width:720px}
.meta{font-size:12.5px;color:var(--muted);margin-top:6px}
.sec-h{display:flex;flex-wrap:wrap;align-items:end;gap:10px;margin:26px 0 12px}
.sec-h h2{font-size:24px;font-weight:700}
.sec-h p{margin:0;color:var(--muted);font-size:14px;flex-basis:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-s)}
.pad{padding:16px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--chip);border:1px solid var(--line);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--c,#999)}
.chip.k-active{color:var(--accent)} .chip.k-buff{color:#1f9d6b} .chip.k-passive{color:var(--muted)}
[data-theme="dark"] .chip.k-buff{color:#6fe0ad}
.muted{color:var(--muted)}
.grid{display:grid;gap:12px}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.toolbar input[type=search],.toolbar select{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0}
.toolbar input[type=search]{flex:1 1 220px}
.toolbar label{font-size:13.5px;display:inline-flex;gap:6px;align-items:center;color:var(--muted)}
.seg{display:inline-flex;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:9px;padding:5px 11px;cursor:pointer;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card-2);color:var(--ink);box-shadow:var(--shadow-s)}
.count{font-size:13px;color:var(--muted);margin:-4px 0 10px}
.more{display:block;margin:16px auto 0;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 20px;cursor:pointer;font-family:var(--display)}
/* job tree */
.fam{margin-bottom:16px;padding:14px}
.fam-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.jico{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--chip);border:1px solid var(--line)}
.fam-h h3{font-size:20px}
.fam-h .d{font-size:13.5px;color:var(--muted);margin-top:2px}
.c2row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:900px){.c2row{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.c2row{grid-template-columns:1fr}}
.jbtn{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card-2);border-radius:14px;padding:10px 12px;cursor:pointer;transition:transform .15s,border-color .15s}
.jbtn:hover{transform:translateY(-2px);border-color:var(--accent)}
.jbtn b{font-family:var(--display);font-size:15.5px;display:block}
.jbtn small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4;margin-top:2px}
.tier{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--accent)}
.arrow{color:var(--muted);text-align:center;font-size:13px;margin:4px 0}
.hc{border-style:dashed;border-color:color-mix(in srgb,var(--gold) 60%,transparent)}
.hc .tier{color:var(--gold)}
/* skill tree */
.jobpick{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.jobpick select{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-family:var(--display);font-size:16px;max-width:100%}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.crumbs button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:4px 10px;cursor:pointer}
.crumbs button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.jinfo{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;margin-bottom:14px}
@media (max-width:640px){.jinfo{grid-template-columns:1fr}}
.jinfo h2{font-size:26px}
.kv{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lines{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
.line{padding:12px}
.line-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-family:var(--display);font-weight:600;font-size:16.5px}
.line-h .chip{font-family:var(--body)}
.sk{position:relative;border:1px solid var(--line);background:var(--card-2);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.sk.dep{margin-left:14px}
.sk.dep::before{content:"";position:absolute;left:-10px;top:-9px;width:9px;height:24px;border-left:2px solid var(--line);border-bottom:2px solid var(--line);border-bottom-left-radius:8px}
.sk-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sk-h b{font-family:var(--display);font-size:15.5px;margin-right:2px}
.sk p{margin:6px 0 0;font-size:14px}
.sk .lvx{font-size:12px;font-weight:700;color:var(--muted);margin-right:4px}
.sk .req{font-size:12.5px;color:var(--muted);margin-top:6px}
.sk .req a{color:var(--accent);cursor:pointer;text-decoration:none}
.sk .grow{font-size:12.5px;color:var(--muted);margin-top:4px;border-top:1px dashed var(--line);padding-top:5px}
.sk .nums{font-size:12px;color:var(--muted);margin-top:5px}
.sk.flash{animation:fl 1.2s}
@keyframes fl{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:none}}
.inherit{margin-top:18px}
.inherit summary{cursor:pointer;font-family:var(--display);font-weight:600;font-size:16px;padding:6px 0}
/* builds */
.bgrid{display:grid;grid-template-columns:320px 1fr;gap:14px;align-items:start}
@media (max-width:900px){.bgrid{grid-template-columns:1fr}}
.bside{position:sticky;top:130px}
@media (max-width:900px){.bside{position:static}}
.bside h3{font-size:16px;margin:0 0 8px}
.lpick{display:flex;flex-direction:column;gap:6px;margin:6px 0 14px}
.lpick label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;background:var(--card-2);font-size:14px}
.lpick label small{display:block;color:var(--muted);font-size:12px}
.lpick input{margin-top:4px;accent-color:var(--accent)}
.lpick .grp{font-size:12px;font-weight:700;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.4px}
.order{counter-reset:o;list-style:none;margin:0;padding:0;display:grid;gap:6px}
.order li{counter-increment:o;display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);background:var(--card-2);border-radius:12px;padding:7px 10px;font-size:14px}
.order li::before{content:counter(o);font-family:var(--display);font-weight:700;color:var(--accent);text-align:center}
.order li small{display:block;color:var(--muted);font-size:12px}
.order .lv{font-family:var(--display);font-weight:700;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border:1px solid var(--line);background:var(--card-2);border-radius:12px;padding:8px 10px}
.stat b{font-family:var(--display);font-size:18px}
.stat .barx{height:6px;border-radius:4px;background:var(--chip);margin-top:6px;overflow:hidden}
.stat .barx i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.stat small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.prio{font-size:11.5px;font-weight:700;color:var(--accent)}
.note{font-size:13.5px;color:var(--muted);background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.bblock{margin-bottom:14px}
.bblock h3{font-size:18px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.brk{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
/* items */
.it{padding:12px;display:flex;flex-direction:column;gap:5px}
.it-h{display:flex;align-items:start;gap:8px}
.it-h b{font-family:var(--display);font-size:15.5px;flex:1;line-height:1.3}
.it .lvr{font-family:var(--display);font-weight:700;font-size:13px;white-space:nowrap;color:var(--muted)}
.it .st{display:flex;flex-wrap:wrap;gap:4px}
.it .st span{font-size:12.5px;background:var(--chip);border-radius:8px;padding:1px 7px}
.it .ab{font-size:13px;line-height:1.45}
.it .ab b{color:var(--accent);font-weight:600}
.it .src{font-size:12px;color:var(--muted)}
.rar-common{--rc:var(--r-common)} .rar-rare{--rc:var(--r-rare)} .rar-epic{--rc:var(--r-epic)} .rar-legend{--rc:var(--r-legend)}
.it{border-top:3px solid var(--rc,var(--line))}
.rname{color:var(--rc);font-weight:700;font-size:12px}
.mini{font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--card-2);border-left:3px solid var(--rc,var(--line))}
.mini b{font-family:var(--display);font-weight:600}
.mini small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
/* monsters */
.mo{padding:12px;display:flex;flex-direction:column;gap:6px}
.mo-h{display:flex;gap:8px;align-items:start}
.mo-h b{font-family:var(--display);font-size:16px;flex:1;line-height:1.3}
.mo .lvr{font-family:var(--display);font-weight:700;font-size:13px;white-space:nowrap}
.bars{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:12px;align-items:center}
.bars span{color:var(--muted)}
.bars i{display:block;height:6px;border-radius:4px;background:var(--chip);overflow:hidden;position:relative}
.bars i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--bc,var(--accent));border-radius:4px}
.maps{font-size:12.5px;color:var(--muted);line-height:1.5}
.weak{font-size:12.5px}
.boss{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 50%,transparent)}
table.el{border-collapse:collapse;font-size:13px;width:100%;min-width:640px}
table.el th,table.el td{border:1px solid var(--line);padding:6px;text-align:center}
table.el th{font-family:var(--display);font-weight:600;background:var(--chip)}
.tblwrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.v-hi{background:rgba(46,170,90,.22);font-weight:700}
.v-lo{background:rgba(220,60,60,.16)}
.v-0{background:rgba(120,120,120,.25);color:var(--muted)}
.statinfo{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.statinfo .card b{font-family:var(--display);font-size:17px}
.statinfo .card p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:18px 0 30px;font-size:12.5px;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
/* systems */
.sysgrid{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
@media (max-width:860px){.sysgrid{grid-template-columns:1fr}}
.sysnav{position:sticky;top:120px;display:flex;flex-direction:column;gap:2px;padding:8px;max-height:calc(100vh - 140px);overflow:auto}
.sysnav a{text-decoration:none;padding:7px 10px;border-radius:10px;font-size:14.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.sysnav a:hover{background:var(--chip);color:var(--ink)}
.sysnav a.on{background:var(--card-2);color:var(--ink);font-weight:600;box-shadow:var(--shadow-s)}
@media (max-width:860px){.sysnav{position:static;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;max-height:none}.sysnav a{flex:none}}
.sysbody h2{font-size:26px;margin-bottom:4px}
.sysbody .lead{color:var(--muted);margin:0 0 14px}
.sysbody h3{font-size:18px;margin:20px 0 10px}
.tbl{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.tbl th{font-family:var(--display);font-weight:600;font-size:13px;color:var(--muted);background:var(--chip)}
.tbl td.n,.tbl th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.steps{margin:6px 0 0;padding-left:20px;font-size:14px}
.steps li{margin:2px 0}
.say{font-size:13.5px;color:var(--muted);font-style:italic;margin:4px 0 0}
.gift{font-size:12.5px;color:var(--gold);font-weight:600;margin-top:6px}
.rate{font-weight:700}
.r-hi{color:#2a9d57}.r-mid{color:#c58a12}.r-lo{color:#d04545}
[data-theme="dark"] .r-hi{color:#6fe0a0}[data-theme="dark"] .r-mid{color:#ffc94d}[data-theme="dark"] .r-lo{color:#ff7b7b}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:10px 0}
.fact{border:1px solid var(--line);background:var(--card-2);border-radius:12px;padding:9px 12px}
.fact b{display:block;font-family:var(--display);font-size:19px}
.fact small{color:var(--muted);font-size:12.5px;line-height:1.4;display:block}
kbd{font-family:ui-monospace,monospace;font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 5px;background:var(--card-2)}
.empty{padding:30px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><div class="stars"></div><div class="moon"></div></div>
<header class="top"><div class="wrap">
  <div class="bar">
    <a class="logo" href="./"><img src="img/penguin-icon.jpg" alt="">PenguinzGear <small>/ Night Camp</small></a>
    <span class="sp"></span>
    <a class="iconbtn" href="https://play.nightcamp.app/" target="_blank" rel="noopener" title="เปิดเกม">▶ เล่นเกม</a>
    <button class="iconbtn" id="themeBtn" aria-label="สลับธีม">🌙</button>
  </div>
  <nav class="tabs" id="tabs" aria-label="หมวดไกด์">
    <a href="#jobs" data-t="jobs">อาชีพ</a>
    <a href="#skills" data-t="skills">สกิลทรี</a>
    <a href="#builds" data-t="builds">บิลด์</a>
    <a href="#gear" data-t="gear">อุปกรณ์</a>
    <a href="#monsters" data-t="monsters">มอนสเตอร์</a>

  </nav>
</div></header>

<main class="wrap" id="app"><div class="loading">กำลังโหลดข้อมูลเกม…</div></main>

<footer><div class="wrap"><span>🔥 Night Camp Guide · PenguinzGear (แฟนไกด์ ไม่เกี่ยวข้องกับทีมผู้พัฒนา)</span><span id="ver"></span></div></footer>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D=null;

/* ---------- derived data ---------- */
let FAM={}, SK_OWNER={}, MAP_AREA={};
function prep(){
  const J=D.jobs;
  for(const [id,j] of Object.entries(J)){
    j.id=id; j.fam = j.tier<=1 ? id : (j.tier===2 ? j.from : J[j.from].from);
    for(const s of j.skills||[]) (SK_OWNER[s]=SK_OWNER[s]||[]).push(id);
  }
  for(const j of Object.values(J)){ // weapons inherit down the tree
    const w=new Set(); let c=j; while(c){ (c.weapons||[]).forEach(x=>w.add(x)); c=J[c.from]; }
    j.allW=[...w];
  }
  for(const [a,v] of Object.entries(D.areas)) for(const m of v.maps) MAP_AREA[m]=a;
  for(const [id,s] of Object.entries(D.skills)) s.id=id;
  for(const it of Object.values(D.items)) it.lv=it.lv||0;
}
const chain=id=>{const out=[];let c=D.jobs[id];while(c){out.unshift(c.id);c=D.jobs[c.from];}return out;};
const kids=id=>Object.values(D.jobs).filter(j=>j.from===id);
function jobOwnerName(sid){const o=(SK_OWNER[sid]||[]).filter(x=>x!=='traveler');return o.length?D.jobs[o[0]].name:''}

  const sp=(s.sp1||s.spMax)?`SP ${s.sp1}${s.spMax!==s.sp1?'→'+s.spMax:''}`:'';

function linesOf(j){
  const L=(j.lines&&j.lines.length?j.lines:[]).map(l=>({...l,sk:[]}));
  const other={id:'_',name:'ทั่วไป',el:null,sk:[]};
  for(const sid of j.skills){const s=D.skills[sid];if(!s)continue;(L.find(l=>l.id===s.line)||other).sk.push(s)}
  if(other.sk.length) L.push(other);
  // order each line by prerequisites
  for(const l of L){
    const ids=new Set(l.sk.map(s=>s.id)), depth={};
    const dp=s=>{ if(depth[s.id]!=null) return depth[s.id]; depth[s.id]=0; let d=0; for(const [r] of s.req||[]) if(ids.has(r)) d=Math.max(d,dp(D.skills[r])+1); return depth[s.id]=d; };
    l.sk.forEach(dp); l.sk.sort((a,b)=>depth[a.id]-depth[b.id]); l.depth=depth;
  }
  return L.filter(l=>l.sk.length);
}

/* ================= BUILDS ================= */
function jobMain(j){
  const path=chain(j.id).map(x=>D.jobs[x]);
  let mag=0,phy=0;
  for(const p of path) for(const sid of p.skills){const s=D.skills[sid];if(!s)continue;if(s.type==='magic'||s.type==='heal')mag++;else if(s.type==='phys')phy++;}
  const w=j.allW, ranged=w.some(x=>RANGED.has(x)), magicW=w.some(x=>['staff','orb','lantern','bell','book'].includes(x));
  if(mag>phy) return 'int';
  if(ranged && !w.some(x=>['sword','dagger','mace','knuckle'].includes(x)&&!RANGED.has(x))) return 'dex';
  if(ranged) return 'dex';
  if(magicW&&mag>=phy*0.6) return 'int';
  return 'str';
}
function lineRole(lines){
  const t=lines.map(l=>l.name+' '+l.id).join(' ');
  const r=new Set();
  if(/guard|shield|ปราการ|พิทักษ์|โล่|team|ทีม/i.test(t)) r.add('tank');
  if(/heal|bless|ฮีล|พร|support|ทีม/i.test(t)) r.add('support');
  if(/berserk|rapid|quick|คลั่ง|เร็ว|รัว/i.test(t)) r.add('speed');
  if(/venom|crit|shadow|พิษ|เงา|คริ/i.test(t)) r.add('crit');
  return r;
}
function statPlan(main,roles){
  // priority weights → suggestion at Lv99 (cap 80 full effect, above works at 40%)
  const w={str:0,agi:0,vit:1,int:0,dex:0,luk:0};
  w[main]=5;
  if(main==='int'){w.dex+=3;w.vit+=1}
  if(main==='str'){w.agi+=2.5;w.dex+=1;w.vit+=1}
  if(main==='dex'){w.agi+=2.5;w.luk+=1}
  if(roles.has('tank')){w.vit+=3.5;w.agi=Math.max(0,w.agi-1)}
  if(roles.has('support')){w.vit+=1.5;if(main!=='int')w.int+=2}
  if(roles.has('speed'))w.agi+=1.5;
  if(roles.has('crit'))w.luk+=2.5;
  const order=Object.entries(w).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  return order.map(([k,v],i)=>({k,v,target:i===0?80:Math.max(20,Math.min(80,Math.round(v/5*80)))}));
}
const WHY={str:'ATK ระยะประชิด 1.6/แต้ม + เบาะเกราะแตก',agi:'ความเร็วโจมตี +0.5%/แต้ม (สูงสุด ×1.5) + หลบเฉียด',vit:'HP +1%/แต้ม · รับดาเมจ −0.2%/แต้ม · ต้านสถานะ',int:'MATK 1.6/แต้ม · พลังฮีล · SP สูงสุดและฟื้น SP',dex:'ATK ธนู/ปืน · ร่ายไว +0.6%/แต้ม (สูงสุด 50%) · ความแม่น',luk:'คริ 0.3%/แต้ม · แรงคริ ×1.4 +0.4%/แต้ม · โอกาสติดสถานะ'};
function skillPath(j,lineIds){
  const path=chain(j.id).map(x=>D.jobs[x]).filter(x=>x.tier>=1);
  const picked=new Map(); // sid -> lv
  const need=(sid,lv)=>{const s=D.skills[sid];if(!s)return;for(const [r,l] of (s.reqAny?(s.req||[]).slice(0,1):(s.req||[]))) need(r,l);picked.set(sid,Math.max(picked.get(sid)||0,lv));};
  const order=[];
  for(const p of path){
    for(const l of linesOf(p)){
      if(!lineIds.has(p.id+':'+l.id)) continue;
      for(const s of l.sk){ need(s.id,s.max); }
    }
  }
  // emit in job order then prerequisite depth
  const seen=new Set();
  const emit=sid=>{if(seen.has(sid))return;const s=D.skills[sid];for(const [r] of (s.reqAny?(s.req||[]).slice(0,1):(s.req||[]))) if(picked.has(r)) emit(r);seen.add(sid);order.push([s,picked.get(sid)]);};
  for(const p of path) for(const sid of p.skills) if(picked.has(sid)) emit(sid);
  for(const sid of picked.keys()) emit(sid);
  return order;
}
function gearFor(j,main){
  const w=new Set(j.allW), I=Object.values(D.items);
  const wt={str:{str:3,atk:3,crit:1,hit:.5},int:{int:3,skill:40,sp:.02,cdr:30},dex:{dex:3,hit:1,crit:1,agi:1},agi:{agi:3}}[main]||{};
  const score=it=>{let s=0;const st=it.stats||{};for(const [k,v] of Object.entries(st)) s+=(wt[k]||(k==='def'||k==='mdef'?1:k==='hp'?.02:k===main?3:.3))*v;return s};
  const RB={common:0,rare:1,epic:2,legend:3};
  const brackets=[[1,30],[31,55],[56,79],[80,99]];
  const weapons=brackets.map(([a,b])=>{
    const list=I.filter(it=>it.slot==='weapon'&&w.has(it.wtype)&&it.lv>=a&&it.lv<=b);
    list.sort((x,y)=>((y.dmg?(y.dmg[0]+y.dmg[1])/2:0)*(1+RB[y.rarity]*.04)+score(y)*2)-((x.dmg?(x.dmg[0]+x.dmg[1])/2:0)*(1+RB[x.rarity]*.04)+score(x)*2));
    return [a,b,list.slice(0,3)];
  });
  const armorSlots=['hat','top','pants','robe','cape','acc','shield','glasses'];
  const armor=armorSlots.map(sl=>{
    const list=I.filter(it=>it.slot===sl&&(sl!=='shield'||j.allW.some(x=>(D.wtypes[x]||{}).h===1)));
    list.sort((a,b)=>(score(b)+(b.lv/10)+RB[b.rarity]*2)-(score(a)+(a.lv/10)+RB[a.rarity]*2));
    return [sl,list.slice(0,2)];
  }).filter(([,l])=>l.length);
  return {weapons,armor};
}

      <div class="note">กติกาในเกม: แต่ละสเตตัสได้ผลเต็มถึง <b>30 + 0.55 × Base Lv</b> (สูงสุด 80) ส่วนที่เกินได้ผลแค่ 40% — ที่ Lv 50 ควรดันสเตตัสหลักถึง ~57, ที่ Lv 90+ ถึง 80 แล้วค่อยเทที่เหลือลงอันดับถัดไป ตัวเลข ≈ คือเป้าที่ Lv 99</div></div>

      ${it.wsk?`<div class="ab"><b>สกิล</b> ${esc(it.wsk)}</div>`:''}
      ${it.gs&&it.gs.src?`<div class="src">ได้จาก: ${esc(srcTxt(it.gs.src))}</div>`:''}
    </div>`).join('')||'<div class="empty">ไม่พบอุปกรณ์</div>';

  $('#gmore').onclick=()=>{shown+=60;draw()};

function srcTxt(src){
  const out=[];
  if(src.mob){const m=D.monsters[src.mob];out.push('มอน '+(m?m.name:src.mob))}
  if(src.chest) out.push('หีบ '+String(src.chest).replace('chest_',''));
  for(const [k,v] of Object.entries(src)) if(k!=='mob'&&k!=='chest') out.push(k+' '+v);
  return out.join(' · ');
}

function viewSystems(arg){
  if(!SY){ app.innerHTML='<div class="loading">กำลังโหลดข้อมูลระบบเกม…</div>';
    (SYP=SYP||fetch('nightcamp-systems.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}))
      .then(d=>{SY=d;if(location.hash.startsWith('#systems'))viewSystems(arg)}).catch(e=>{SYP=null;app.innerHTML=`<div class="empty">โหลดข้อมูลไม่สำเร็จ (${esc(e.message)})</div>`}); return; }
  const cur=SYS.find(s=>s[0]===arg)||SYS[0];
  let body=''; try{ body=cur[3](); }catch(e){ body=`<div class="empty">แสดงส่วนนี้ไม่ได้ (${esc(e.message)})</div>`; }
  app.innerHTML=`<div class="sec-h"><h2>ระบบเกม</h2><p>ทุกระบบใน Night Camp อธิบายจากบทเรียนในเกมและตัวเลขจริงในข้อมูลเกม</p></div>
  <div class="sysgrid"><nav class="card sysnav">${SYS.map(s=>`<a href="#systems/${s[0]}" class="${s===cur?'on':''}"><span>${s[1]}</span>${s[2]}</a>`).join('')}</nav>
  <div class="sysbody">${body}</div></div>`;
}

  ${Object.entries(sk).map(([k,s])=>{const t=tools.find(x=>x.skill===k);const up=(L.UPGRADES[Object.keys(L.TOOLS).find(x=>L.TOOLS[x].skill===k)]||[]);const gd=L.GUIDE[k]||[];
   return `<div class="card pad" style="margin-bottom:12px"><div class="sk-h"><b style="font-family:var(--display);font-size:19px">${esc(s.name)}</b>${t&&t.mentor?`<span class="chip">อาจารย์: ${esc(t.mentor)}</span>`:''}${s.place?`<span class="chip">📍 ${esc(s.place)}</span>`:''}</div>

   ${s.perks?`<div class="kv">${s.perks.map(([lv,t])=>`<span class="chip">Lv ${lv}: ${esc(t)}</span>`).join('')}</div>`:''}
   ${t?`<h3 style="font-size:15px;margin:14px 0 6px">เครื่องมือ</h3><table class="tbl"><tr><th>เครื่องมือ</th><th class="n">ต้องการ Lv</th><th class="n">เหรียญ</th><th>วัตถุดิบ</th></tr>${t.names.map((n,i)=>`<tr><td><b>${esc(n)}</b></td><td class="n">${i?up[i-1]&&up[i-1].lv:'เริ่มต้น'}</td><td class="n">${i&&up[i-1]?num(up[i-1].coins):'-'}</td><td>${i&&up[i-1]?esc(Object.entries(up[i-1].matN||{}).map(([a,b])=>a+' ×'+b).join(', ')):''}</td></tr>`).join('')}</table>`:''}
   ${gd.length?`<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600">ได้อะไร / หาที่ไหน (${gd.length})</summary><table class="tbl" style="margin-top:6px"><tr><th>ของ</th><th class="n">Lv</th><th>ที่ไหน</th></tr>${gd.map(e=>`<tr><td><b>${esc(e.name)}</b>${e.night?' <span class="chip">กลางคืน</span>':''}</td><td class="n">${e.lv}</td><td>${esc(e.where||'')}</td></tr>`).join('')}</table></details>`:''}</div>`}).join('')}
  <h3>ผักที่ปลูกได้</h3><table class="tbl"><tr><th>ผัก</th><th class="n">Lv</th><th class="n">เวลาโต</th><th class="n">XP</th><th class="n">ราคาขาย</th></tr>${crops.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td class="n">${c.lv}</td><td class="n">${c.mins} นาที</td><td class="n">${c.xp}</td><td class="n">${c.price}</td></tr>`).join('')}</table>
  <h3>ปลา (${L.FISH.length})</h3><div class="tblwrap"><table class="tbl"><tr><th>ปลา</th><th class="n">Lv</th><th>แหล่งน้ำ</th><th class="n">ขนาด (ซม.)</th></tr>${L.FISH.sort((a,b)=>a.lv-b.lv).map(f=>`<tr><td><b>${esc(f.name)}</b><div class="muted" style="font-size:12px">${esc(f.desc)}</div></td><td class="n">${f.lv}</td><td>${esc((f.where||[]).map(w=>({pond:'บ่อ',marsh:'บึง',lake:'ทะเลสาบ',river:'แม่น้ำ',sea:'ทะเล',lava:'ลาวา',cave:'ถ้ำ',swamp:'หนอง'})[w]||w).join(', '))}</td><td class="n">${Array.isArray(f.size)?f.size.join('–'):''}</td></tr>`).join('')}</table></div>`;
}
function sysCook(){

  ${SY.dishes.sort((a,b)=>a.lv-b.lv).map(d=>`<tr><td><b>${esc(d.name)}</b><div class="muted" style="font-size:12px">${esc(d.desc||'')}</div></td><td class="n">${d.lv}</td><td><span class="chip ${d.kind==='red'?'k-active':'k-buff'}">${esc(d.tag)}</span></td><td>${esc(Object.entries(d.matN||{}).map(([a,b])=>a+' ×'+b).join(', '))}</td><td class="n">${num(d.coins||0)}</td></tr>`).join('')}</table></div>

}
function sysCraft(){
  const R=Object.values(SY.craftR), E=SY.econ;
  const skn={mine:'ขุดแร่',wood:'ตัดไม้',farm:'ปลูกผัก',fish:'ตกปลา',cook:'ทำอาหาร'};
  return `<h2>⚒️ งานฝีมือ & ตีอาวุธ</h2><p class="lead">แปรรูปวัตถุดิบเป็นของมีราคา (กด <kbd>Y</kbd> นอกค่าย) และตีอาวุธใหม่ที่เตาตีเหล็ก</p>
  <h3>สูตรแปรรูป (${R.length})</h3><div class="tblwrap"><table class="tbl"><tr><th>ของที่ได้</th><th>ต้องใช้</th><th>อาชีพเสริม</th><th class="n">เหรียญ</th></tr>
  ${R.sort((a,b)=>(a.skill||'').localeCompare(b.skill||'')||a.lv-b.lv).map(r=>`<tr><td><b>${esc(nmOf(r.out))}</b>${r.n>1?` ×${r.n}`:''}</td><td>${matList(r.in)}</td><td>${esc(skn[r.skill]||r.skill||'')} Lv ${r.lv}</td><td class="n">${r.coins}</td></tr>`).join('')}</table></div>
  <h3>ตีดาบใหญ่ที่เตาตีเหล็ก</h3><table class="tbl"><tr><th>อาวุธ</th><th class="n">เหรียญ</th><th>วัตถุดิบ</th></tr>
  ${Object.entries(E.recipes).map(([k,v])=>`<tr><td><b>${esc(E.names[k]||nmOf(k))}</b></td><td class="n">${num(v.coins)}</td><td>${esc(Object.entries(v.matN||{}).map(([a,b])=>a+' ×'+b).join(', '))||'-'}</td></tr>`).join('')}</table>`;
}
function sysDungeons(){
  const Dg=Object.entries(SY.dungeons), Mi=Object.entries(SY.mines), B=Object.values(SY.bossRespawn).sort((a,b)=>a.respawn-b.respawn);
  const pn=id=>(D.maps[id]||SY.dungeons[id]||SY.mines[id]||{}).name||id;
  const mins=s=>s>=3600?(s/3600)+' ชม.':Math.round(s/60)+' นาที';
  return `<h2>🕳️ ดันเจี้ยน & บอสสนาม</h2><p class="lead">ดันเจี้ยนสร้างห้องสุ่ม มีหีบสมบัติและกับดัก · บางดันมีทางลับไปห้องบอส</p>
  <h3>ดันเจี้ยน (${Dg.length})</h3><div class="tblwrap"><table class="tbl"><tr><th>ดันเจี้ยน</th><th>เลเวล</th><th>ทางเข้าจาก</th><th class="n">ห้อง</th><th class="n">หีบ</th></tr>
  ${Dg.map(([k,d])=>`<tr><td><b>${esc(d.name)}</b>${d.mine?' <span class="chip">มีสายแร่</span>':''}</td><td>${esc(d.lvText||'')}</td><td>${esc(pn(d.parent))}</td><td class="n">${d.rooms||''}</td><td class="n">${d.chests||''}</td></tr>`).join('')}</table></div>
  <h3>เหมือง (${Mi.length})</h3><table class="tbl"><tr><th>เหมือง</th><th>เลเวล</th></tr>${Mi.map(([k,d])=>`<tr><td><b>${esc(d.name)}</b></td><td>${esc(d.lvText||'')}</td></tr>`).join('')}</table>
  <h3>เวลาเกิดบอส</h3><div class="grid g-auto">${B.map(b=>`<div class="mini" style="--rc:var(--gold)"><b>${esc(b.name)}</b><small>เกิดใหม่ทุก ${mins(b.respawn)}</small></div>`).join('')}</div>`;
}
function sysRoot(){
  const R=SY.root;

function sysEvents(){
  const B=SY.blood, M=SY.mapev, P=SY.pup;

  <div class="facts"><div class="fact"><b>HP ${x(B.HP)} · ATK ${x(B.ATK)}</b><small>มอนแข็งแรงขึ้น</small></div><div class="fact"><b>EXP ${x(B.EXP)}</b><small>EXP มากขึ้น</small></div>
   <div class="fact"><b>${B.RESPAWN} วิ</b><small>มอนเกิดใหม่เร็วมาก</small></div><div class="fact"><b>วัตถุดิบ +${Math.round(B.MAT*100)}%</b><small>ของดรอปเพิ่ม · หินออฟ +${Math.round(B.STONE*100)}%</small></div>

  <div class="facts">${Object.entries(M.K).map(([k,v])=>`<div class="fact"><b>${esc(v.name)}</b><small>${({root:`รากดำบุกเป็นระลอก (${M.R.WAVES.length} ระลอก) มีหัวหน้าทุก ${M.R.CAPTAIN} ตัว`,thorn:`หนามดำ ${M.R.THORNS} จุดงอกขึ้น ต้องทำลายก่อนโต (${M.R.GROW/60} นาที)`,mist:`หมอกพิษแผ่กว้าง ทำลายหัวใจ ${M.R.HEARTS} ดวง · ในหมอกมอนแรง ×${M.R.MIST_ATK}`})[k]||''}</small></div>`).join('')}</div>
  <h3>🎭 หอหุ่น</h3><p class="muted">ด่านจับเวลา ${P.halls} ห้องโถง ห้องละ ${P.stage} ด่าน รีเซ็ตรายสัปดาห์ · เหรียญตามเวลาที่ทำได้: ${P.medals.map(([k,n,s])=>`${esc(n)} ภายใน ${s/60} นาที`).join(' · ')}</p>`;
}
function sysGuild(){

  <h3>กิลด์</h3><p class="muted" style="margin-top:-4px">ตั้งกิลด์ ชวนสมาชิก บริจาคเข้ากองไฟกิลด์ จ่ายค่าบำรุง ทำเควสกิลด์ และปลุกบอสกิลด์ · มีตารางอันดับกิลด์</p>

   <div class="fact"><b>ตัดไม้เติมไฟ</b><small>ตัด ${G.chopS} วิได้ฟืน · แบกได้ ${G.carry} ท่อน · ฟืน 1 ท่อน = เชื้อ ${G.wood}</small></div>

   <div class="fact"><b>รางวัล</b><small>พื้นฐาน ${G.reward.base} + ต่อการฆ่า ${G.reward.perKill} + ต่อฟืน ${G.reward.perWood} + ต่อนาที ${G.reward.perMin} · ชนะ ×${G.reward.win} (สูงสุด ${G.reward.cap})</small></div></div>

  <div class="facts"><div class="fact"><b>ดาเมจ ×${P.dmg}</b><small>ดาเมจใส่ผู้เล่นลดลง</small></div><div class="fact"><b>คริ ×${P.crit}</b><small>ดาเมจคริลดลง</small></div>
   <div class="fact"><b>ควบคุม ×${P.cc} · สโลว์ ×${P.slow}</b><small>สถานะควบคุมสั้นลง</small></div><div class="fact"><b>ต้านทาน ${P.immune} วิ</b><small>หลังโดนควบคุม</small></div></div>`;

function sysCosmetic(){
  const W=SY.wings, byT={}; for(const w of SY.wingLooks)(byT[w.tier]=byT[w.tier]||[]).push(w.name);
  return `<h2>🪽 พาหนะ ปีก สัตว์เลี้ยง</h2>
  <h3>พาหนะ</h3><p class="muted" style="margin-top:-4px">เรียกพาหนะเพื่อวิ่งเร็วขึ้น (+${Math.round(SY.mountRule.bonus*100)}%) · โดนตี ${SY.mountRule.hits} ครั้งภายใน ${SY.mountRule.hitsIn} วิจะตกจากพาหนะ</p>
